name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Example lists, README tables, shell helpers
        env:
          CLEANYOURTV_STRICT: ${{ github.event_name == 'push' && '1' || '' }}
        run: python3 -m unittest discover -s tests -v

  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: The launcher stays small
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          theme_size=$(python3 -c 'import zipfile; z=zipfile.ZipFile("launcher/app/build/outputs/apk/release/app-release.apk"); print(sum(i.compress_size for i in z.infolist() if i.filename.startswith("assets/default-theme/")))')
          echo "release APK: $((size / 1024)) KB"
          echo "bundled theme: $((theme_size / 1024)) KB"
          test "$theme_size" -lt 12582912 || { echo "Bundled theme exceeds 12 MiB"; exit 1; }
          test "$((size - theme_size))" -lt 471040 || { echo "Launcher excluding bundled theme is over 460 KB"; exit 1; }
